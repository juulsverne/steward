# /etc/nginx/nginx.conf on the Steward instance: plain HTTP on :80 (reachable only from the
# CloudFront origin-facing prefix list), proxied to uvicorn on 127.0.0.1:8000.
# @CF_DOMAIN@ is substituted by deploy/user-data.sh (a marker distinct from the user-data
# placeholders, which deploy/provision.sh renders first) with the CloudFront hostname so the
# application's allowed-host check always sees its configured origin host.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_user_agent" cf=$http_x_amz_cf_id rt=$request_time';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 64m;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host @CF_DOMAIN@;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host @CF_DOMAIN@;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_request_buffering off;
        }
    }
}
